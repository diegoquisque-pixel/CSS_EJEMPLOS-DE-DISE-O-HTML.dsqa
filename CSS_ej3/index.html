<!-- Proyecto: Postal con HTML y CSS -->
<!-- Archivo: index.html (estructura de la página) -->

<!-- Define el tipo de documento como HTML5 -->
<!DOCTYPE html>

<!-- Elemento raíz de la página. lang="es" indica que el idioma es español -->
<html lang="es">

<!-- HEAD: información de la página que no se muestra directamente en pantalla -->
<head>
    <!-- Codificación de caracteres (permite tildes, ñ y símbolos) -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares y otros dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Postal</title>

    <!-- Enlaza el archivo CSS que contiene los estilos (colores, tamaños, etc.) -->
    <link rel="stylesheet" href="style.css">
             <link rel="icon" href="../spotify.png" type="image/png">

</head>

<!-- BODY: todo el contenido visible de la página -->
<body>

    <!-- Contenedor principal de la postal -->
    <div class="postcard">

        <!-- Lado izquierdo (aquí va el mensaje de la postal) -->
        <div class="left-side">
        </div>

        <!-- Lado derecho (aquí va la dirección) -->
        <div class="right-side">

            <!-- Cuadro de la estampilla -->
            <div class="stamp-box"></div>

            <!-- Líneas donde se escribe la dirección -->
            <div class="address-lines">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>

        </div>

    </div>

</body>
</html>
