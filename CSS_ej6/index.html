<!-- Proyecto: Teclas de Piano con HTML y CSS -->
<!-- Archivo: index.html (estructura de la página) -->

<!-- Define el tipo de documento como HTML5 -->
<!DOCTYPE html>

<!-- Elemento raíz de la página. lang="es" indica que el idioma es español -->
<html lang="es">

<!-- HEAD: inicio del encabezado (información que no se muestra en pantalla) -->
<head>
    <!-- Codificación de caracteres (permite tildes, ñ y símbolos) -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares y otros dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Teclas de Piano</title>

    <!-- Enlaza el archivo CSS que contiene los estilos (colores, tamaños, etc.) -->
    <link rel="stylesheet" href="style.css">
             <link rel="icon" href="../spotify.png" type="image/png">

</head>
<!-- Fin del encabezado -->

<!-- BODY: inicio del cuerpo (todo el contenido visible de la página) -->
<body>

    <!-- Contenedor del piano (agrupa todas las teclas) -->
    <div class="piano">

        <!-- Tecla blanca 1 -->
        <div class="white"></div>

        <!-- Tecla blanca 2 -->
        <div class="white"></div>

        <!-- Tecla blanca 3 -->
        <div class="white"></div>

        <!-- Tecla negra 1 (la clase b1 define su posición) -->
        <div class="black b1"></div>

        <!-- Tecla negra 2 (la clase b2 define su posición) -->
        <div class="black b2"></div>

    </div>
    <!-- Fin del contenedor piano -->

</body>
<!-- Fin del cuerpo -->
</html>
<!-- Fin del documento -->
