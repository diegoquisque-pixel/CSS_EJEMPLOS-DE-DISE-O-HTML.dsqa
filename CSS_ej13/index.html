<!DOCTYPE html> <!-- Define el tipo de documento HTML5 -->
<html lang="es"> <!-- Idioma de la página: español -->
<head>
    <meta charset="UTF-8"> <!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Vista adaptable a dispositivos -->
    <title>Neumorphic Login</title> <!-- Título de la página -->
    <link rel="stylesheet" href="style.css"> <!-- Enlaza el CSS -->
     <link rel="icon" href="../spotify.png" type="image/png">


</head>
<body>
    <div class="card"> <!-- Contenedor principal del formulario -->
        <h2>Login</h2> <!-- Título del formulario -->
        <form>
            <!-- Campo de usuario -->
            <input type="text" placeholder="Username" required>
            
            <!-- Campo de contraseña -->
            <input type="password" placeholder="Password" required>
            
            <!-- Botón de envío -->
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
