<!-- Proyecto: Login Glass (glassmorphism) con HTML y CSS -->
<!-- Archivo: index.html (estructura de la página) -->

<!-- Define el tipo de documento como HTML5 -->
<!DOCTYPE html>

<!-- Elemento raíz de la página. lang="es" indica que el idioma es español -->
<html lang="es">

<!-- HEAD: inicio del encabezado (información que no se muestra en pantalla) -->
<head>
    <!-- Codificación de caracteres (permite tildes, ñ y símbolos) -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares y otros dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Glass Login</title>

    <!-- Enlaza el archivo CSS que contiene los estilos (colores, tamaños, etc.) -->
    <link rel="stylesheet" href="style.css">
             <link rel="icon" href="../spotify.png" type="image/png">

</head>
<!-- Fin del encabezado -->

<!-- BODY: inicio del cuerpo (todo el contenido visible de la página) -->
<body>

    <!-- Contenedor principal del login (la tarjeta de vidrio) -->
    <div class="glass-card">

        <!-- Título de bienvenida -->
        <h2>Welcome</h2>

        <!-- Inicio del formulario -->
        <form>

            <!-- Campo de correo electrónico (required = obligatorio) -->
            <input type="text" placeholder="Email" required>

            <!-- Campo de contraseña (oculta lo que se escribe) -->
            <input type="password" placeholder="Password" required>

            <!-- Botón de envío -->
            <button type="submit">Sign In</button>

        </form>
        <!-- Fin del formulario -->

    </div>
    <!-- Fin del contenedor -->

</body>
<!-- Fin del cuerpo -->
</html>
<!-- Fin del documento -->
