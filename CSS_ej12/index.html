<!-- DSQA - HTML & CSS -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="style.css">
     <link rel="icon" href="../spotify.png" type="image/png">

</head>
<body>

    <!-- Contenedor principal del boleto -->
    <div class="ticket">
        
        <!-- Parte superior del boleto (Roja) -->
        <div class="top">
            <h2>Cinema</h2>
            <div class="movie-title">CS Film</div>
        </div>

        <!-- Parte inferior del boleto (Blanca con información) -->
        <div class="bottom">
            
            <!-- Información de la fecha -->
            <div class="info">
                <div>DATE</div>
                <span>SEP 28</span>
            </div>

            <!-- Información de la hora -->
            <div class="info" style="text-align: center;">
                <div>TIME</div>
                <span>20:00</span>
            </div>

            <!-- Información del asiento -->
            <div class="info" style="text-align: right;">
                <div>SEAT</div>
                <span>A12</span>
            </div>

        </div>
    </div>

</body>
</html>
