<!-- Proyecto: Tarjeta de Perfil con HTML y CSS -->
<!-- Archivo: index.html (estructura de la página) -->

<!-- Indica al navegador que este documento usa HTML5 -->
<!DOCTYPE html>

<!-- Elemento raíz de la página. lang="es" define que el idioma es español -->
<html lang="es">

<!-- HEAD: información de la página que no se muestra directamente en pantalla -->
<head>
    <!-- Codificación de caracteres (permite tildes, ñ y símbolos) -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares y otros dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Tarjeta de Perfil</title>

    <!-- Enlaza el archivo CSS que contiene los estilos (colores, tamaños, etc.) -->
    <link rel="stylesheet" href="style.css">
             <link rel="icon" href="../spotify.png" type="image/png">

</head>

<!-- BODY: todo el contenido visible de la página -->
<body>

    <!-- Contenedor principal de la tarjeta -->
    <div class="card">

        <!-- Nombre y edad de la persona -->
        <h3>Sarah, 39</h3>

        <!-- Ciudad donde vive -->
        <div class="info">CS City</div>

        <!-- Descripción corta de la persona -->
        <p class="bio">Love hiking, coffee, and good conversations.</p>

        <!-- Botón de acción -->
        <button>Match</button>

    </div>

</body>
</html>
