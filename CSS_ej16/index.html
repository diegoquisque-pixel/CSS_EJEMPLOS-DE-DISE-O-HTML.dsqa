<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
         <link rel="icon" href="../spotify.png" type="image/png">

</head>
<body>

    <!-- Contenedor principal de la tarjeta -->
    <div class="card">
        <!-- Parte izquierda (Fondo oscuro con foto) -->
        <div class="left">
        <div class="photo" >  
        <img class="photo" src="../perrito.avif" alt="Foto de perfil">
</div> <!-- Círculo para la imagen -->
        </div>

        <!-- Parte derecha (Información de contacto) -->
        <div class="right">
            <h2>Dogui Dog</h2>
            <p class="title">Web Developer</p>
            
            <!-- Datos de contacto -->
            <div class="info">
                <div>+1 (123) 456-7890</div>
                <div>john@example.com</div>
                <div>www.johndoe.com</div>
            </div>
        </div>

    </div>

</body>
</html>
